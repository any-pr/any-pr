<body><main>

</main><!-- Visual reference: https://milkyfrog.com/ ; SVG approximation, no audio. -->
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),duration=6.8;let t=1.2,last=null;const lerp=(a,b,k)=>a+(b-a)*k,clamp=x=>Math.max(0,Math.min(1,x)),smooth=x=>{x=clamp(x);return x*x*(3-2*x)},attr=(id,key,v)=>$(id).setAttribute(key,v);
function draw(){const laugh=smooth((t-.65)/.45)*(1-smooth((t-5.65)/.7));const pulse=Math.sin(t*21)*laugh;const raise=smooth((t-2.5)/.55)*(1-smooth((t-4.2)/.55));const bend=smooth((t-4.35)/.45)*(1-smooth((t-5.55)/.65));const sway=Math.sin(t*3.2)*2*laugh;
// One continuous silhouette: the head contour and face use the same rotation.
const angle=-laugh*8+Math.sin(t*10)*laugh*2+bend*14;
const rot=(x,y)=>{const a=angle*Math.PI/180;return [377+(x-377)*Math.cos(a)-(y-214)*Math.sin(a),214+(x-377)*Math.sin(a)+(y-214)*Math.cos(a)]};
const p=(x,y)=>rot(x,y).map(v=>v.toFixed(2)).join(' ');
attr('body','d',`M${p(323,196)}C${p(307,177)} ${p(312,145)} ${p(320,123)}C${p(331,95)} ${p(366,85)} ${p(391,99)}C${p(414,111)} ${p(417,140)} ${p(425,162)}C${p(432,180)} 449 209 462 238C481 271 499 315 493 353C492 399 457 431 409 434C366 440 303 419 289 385C270 344 280 298 298 266C312 242 326 221 ${p(323,196)}Z`);
attr('torso','transform',`translate(0 ${pulse*1.7+bend*5}) rotate(${sway*.6-bend*7} 386 420) translate(0 420) scale(${1-pulse*.002} ${1+pulse*.005}) translate(0 -420)`);
attr('head','transform',`rotate(${angle} 377 214)`);
attr('mouth','transform',`translate(348 170) scale(${1+raise*.08} ${.2+laugh*(.93+pulse*.1)})`);
attr('mouth','opacity',smooth(laugh*4));attr('restMouth','opacity',1-smooth(laugh*4));
attr('openEye','opacity',1-laugh);attr('farOpen','opacity',1-laugh);attr('closedEye','opacity',laugh);attr('farClosed','opacity',laugh);attr('shadow','rx',145+pulse*1.3);
// Raised palms stay on the moving scalp rather than floating over it.
const leftTop=rot(326,112),rightTop=rot(392,107);
const lx=lerp(317,leftTop[0],raise),ly=lerp(324+pulse*.9,leftTop[1],raise),rx=lerp(391,rightTop[0],raise),ry=lerp(322+pulse*.9,rightTop[1],raise);
const lp=`M310 251C${lerp(273,251,raise)} ${lerp(276,243,raise)} ${lerp(278,269,raise)} ${lerp(305,160,raise)} ${lx} ${ly}`;
const rp=`M437 248C${lerp(476,505,raise)} ${lerp(279,246,raise)} ${lerp(461,468,raise)} ${lerp(316,148,raise)} ${rx} ${ry}`;
['armL','armLInner'].forEach(id=>attr(id,'d',lp));['armR','armRInner'].forEach(id=>attr(id,'d',rp));attr('handL','transform',`translate(${lx} ${ly}) rotate(${lerp(8,angle-48,raise)})`);attr('handR','transform',`translate(${rx} ${ry}) rotate(${lerp(-8,angle+27,raise)})`);
}
function frame(now){if(last!==null)t=(t+Math.min((now-last)/1000,.05))%duration;last=now;draw();requestAnimationFrame(frame)}draw();requestAnimationFrame(frame);
})();
</script></body></html>
