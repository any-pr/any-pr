[package]
name = "music-api-rs"
version = "1.0.0"
edition = "2021"
description = "Rust rewrite of the music-api PHP endpoints (Kuwo music API proxy)"

[dependencies]
axum = "0.8"
chrono = "0.4"
encoding_rs = "0.8"
futures = "0.3"
md5 = "0.7"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "deflate",
    "brotli",
    "zstd",
    "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
