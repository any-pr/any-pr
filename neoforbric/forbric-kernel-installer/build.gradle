plugins {
	id 'java'
}

group = 'net.forbric'
version = '0.3.1-beta2'

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 17
}

// The installer carries Forbric's OWN jars and nothing else. The NeoForge-patched game base and the NeoForge
// runtime embed Mojang and NeoForge code, so they are never bundled — the installer takes them from a build on
// this machine (see ArtifactSource), which is also what the project's own scripts produce.
def kernelDir = file('../forbric-kernel')
def loaderDir = file('../forbric-loader')
// Read from each module's own build file rather than spelled out here. The four literals this replaces named
// `-0.1.0-SNAPSHOT` jars that forbric-loader stopped writing when it dropped the suffix, so every installer
// built since bundled whatever stale jar was still lying in build/libs, and a clean clone could not build at
// all: the name it asked for was one nothing would ever produce.
def moduleVersion = { File dir ->
	def m = (dir.toPath().resolve('build.gradle').toFile().text =~ /(?m)^version\s*=\s*['"]([^'"]+)['"]/)
	if (!m) throw new GradleException("no version in ${dir}/build.gradle")
	m[0][1]
}
def kernelJar  = { "forbric-kernel-${moduleVersion(kernelDir)}.jar" }
def loaderJar  = { "forbric-loader-${moduleVersion(loaderDir)}.jar" }
def runtimeJar = { "forbricruntime-${moduleVersion(loaderDir)}.jar" }
def genResources = layout.buildDirectory.dir('generated-resources')
// The merge tools ride in EVERY build, slim included. They are 284 KB and they are what turns a
// machine with no prebuilt artifacts into one that can make them; fetching them over the network
// would add a way for the build step to fail before it starts, to save a quarter of a megabyte.
def genTools = layout.buildDirectory.dir('generated-tools')
def isWindows = System.getProperty('os.name').toLowerCase().contains('win')
// The reviewed link baseline the tools jar carries: the same file the loader's gates read.
def linkBaseline = file("${loaderDir}/src/test/resources/merge/link-check-baseline.txt")
def mergeToolsJar = file("${loaderDir}/build/libs/forbric-merge-tools-0.1.0.jar")

tasks.register('buildForbricJars', Exec) {
	description = "Build the kernel jar the installer bundles."
	workingDir kernelDir
	commandLine(isWindows ? ['cmd', '/c', 'gradlew.bat', 'jar'] : ['./gradlew', 'jar'])
	inputs.dir("${kernelDir}/src/main")
	inputs.file("${kernelDir}/build.gradle")
	outputs.dir("${kernelDir}/build/libs")
}

// The loader's two jars, which the installer ALSO bundles and which nothing here used to build. Without this
// the task below consumed whatever happened to be in the loader's build/libs — on this machine, jars from four
// days before the release — and a clean clone had nothing to consume at all.
tasks.register('buildLoaderJars', Exec) {
	description = "Build the forbric-loader jars the installer bundles."
	workingDir loaderDir
	commandLine(isWindows ? ['cmd', '/c', 'gradlew.bat', 'jar', 'runtimeJar']
			: ['./gradlew', 'jar', 'runtimeJar'])
	inputs.dir("${loaderDir}/src/main")
	inputs.file("${loaderDir}/build.gradle")
	outputs.dir("${loaderDir}/build/libs")
}

// The link-check tools, shaded with the ASM they need. Not a library of the installer's — they are run as a
// subprocess, so they travel as a resource and are unpacked next to the build.
tasks.register('buildMergeTools', Exec) {
	description = "Build the merge-tools jar the installer ships and runs."
	workingDir loaderDir
	commandLine(isWindows ? ['cmd', '/c', 'gradlew.bat', 'mergeToolsJar'] : ['./gradlew', 'mergeToolsJar'])
	inputs.dir("${loaderDir}/src/tools")
	inputs.file("${loaderDir}/build.gradle")
	// The baseline rides in this jar but lives under src/test/resources, which the two inputs above do not
	// cover: a baseline-only change left this task UP-TO-DATE and the installer shipping the previous baseline,
	// so players' installs judged the merge against a different list than every gate in the tree.
	inputs.file(linkBaseline).withPropertyName('linkBaseline')
	// The one file this task makes. Declaring the shared build/libs let buildLoaderJars' output decide whether
	// this task was up to date.
	outputs.file(mergeToolsJar)
}

// Development preparation needs the artifact builder and the link-check tools, not a player payload or Fabric
// substrate. Avoid processResources here: that task intentionally builds the complete player installer payload.
tasks.register('devToolsJar', Jar) {
	group = 'development'
	description = 'Build the portable development artifact preparer without the player payload.'
	dependsOn 'compileJava', 'buildMergeTools'
	archiveFileName = 'forbric-dev-tools.jar'
	from sourceSets.main.output.classesDirs
	into('forbric/tools') {
		from(mergeToolsJar) { rename '.*', 'forbric-merge-tools.jar' }
	}
	manifest { attributes 'Main-Class': 'net.forbric.installer.kernel.DevPrepare' }
}

def linkGateClasses = tasks.register('compileLinkGateTest', JavaCompile) {
	dependsOn 'compileJava'
	// The supplied-artifact content check and the window's path fields ride along: the gate's main calls both, so
	// every runner of linkGateTest (CI, the kernel's linkToolTest) exercises them too.
	source = fileTree('src/test/java') {
		include '**/MergedBaseLinkGateTest.java', '**/SuppliedArtifactContentTest.java',
				'**/InstallerWindowInputTest.java'
	}
	classpath = files(sourceSets.main.output.classesDirs)
	destinationDirectory = layout.buildDirectory.dir('link-gate-classes')
}
tasks.register('linkGateTest', JavaExec) {
	group = 'verification'
	description = 'Exercise the packaged link gate with synthetic positive and negative controls.'
	dependsOn linkGateClasses, 'devToolsJar'
	classpath = files(linkGateClasses.flatMap { it.destinationDirectory },
			tasks.named('devToolsJar').flatMap { it.archiveFile })
	mainClass = 'net.forbric.installer.kernel.MergedBaseLinkGateTest'
	doFirst {
		def scratch = layout.buildDirectory.dir('link-gate-test').get().asFile
		scratch.deleteDir()
		scratch.mkdirs()
		args = [scratch.absolutePath]
	}
}
tasks.named('check') { dependsOn 'linkGateTest' }
// This module's tests are main() programs run by linkGateTest above, not a JUnit suite, so the stock test task
// finds nothing to run -- which Gradle 9 makes a failure, and with it every `check` of this module.
tasks.named('test') { failOnNoDiscoveredTests = false }

tasks.register('bundleForbric') {
	description = "Copy Forbric's own jars into the installer's resources, with a manifest describing them."
	dependsOn 'buildForbricJars', 'buildLoaderJars', 'buildMergeTools'
	// Without these the task is "up to date" the moment its output directory exists, and the installer keeps
	// shipping whichever kernel jar it bundled first — an install that silently predates the fix you just made.
	inputs.files(
			file("${kernelDir}/build/libs/${kernelJar()}"),
			file("${loaderDir}/build/libs/${loaderJar()}"),
			file("${loaderDir}/build/libs/${runtimeJar()}"),
			mergeToolsJar)
			.withPropertyName('forbricJars')
			.withPathSensitivity(PathSensitivity.NONE)
	outputs.dir(genResources)
	doLast {
		// Clear the WHOLE output directory, not just forbric/libs. It once also held the merge-tools jar; when
		// that moved to its own task the stale copy stayed behind and collided with the new one, which
		// processResources reports as a duplicate entry rather than as the stale output it is.
		def outDir = genResources.get().asFile
		outDir.deleteDir()
		def libsRoot = new File(outDir, 'forbric/libs')
		libsRoot.mkdirs()

		def entries = []
		def add = { String coordinate, File src ->
			if (!src.isFile()) throw new GradleException("missing ${src} — build it first")
			def parts = coordinate.split(':')
			def rel = "${parts[0].replace('.', '/')}/${parts[1]}/${parts[2]}/${parts[1]}-${parts[2]}.jar"
			def dest = new File(libsRoot, rel)
			dest.parentFile.mkdirs()
			dest.bytes = src.bytes
			entries << [coordinate: coordinate, resource: "/forbric/libs/${rel}", path: rel,
			            sha1: java.security.MessageDigest.getInstance('SHA-1').digest(src.bytes).encodeHex().toString(),
			            size: src.length()]
		}

		// Forbric's own code (Apache-2.0).
		add('net.forbric:forbric-kernel:' + project.version, new File(kernelDir, "build/libs/${kernelJar()}"))
		add('net.forbric:forbric-loader:' + project.version, new File(loaderDir, "build/libs/${loaderJar()}"))
		add('net.forbric:forbricruntime:' + project.version, new File(loaderDir, "build/libs/${runtimeJar()}"))

		// The kernel's own third-party dependencies, taken from the classpath the kernel itself reports so the
		// installed profile cannot drift from what the gates run. All permissively licensed; staged locally so a
		// launch needs no network and no guess about which Maven still carries a given version.
		def command = isWindows ? ['cmd', '/c', 'gradlew.bat', '--offline', '-q', 'printBootClasspath']
				: ['./gradlew', '--offline', '-q', 'printBootClasspath']
		def process = new ProcessBuilder(command).directory(kernelDir).redirectErrorStream(true).start()
		def cpOut = process.inputStream.text
		if (process.waitFor() != 0) {
			throw new GradleException("could not ask the kernel for its classpath:\n" + cpOut)
		}
		def cacheRoot = 'modules-2/files-2.1/'
		cpOut.readLines().findAll { it.contains(File.pathSeparator) }.last()
				.split(File.pathSeparator).each { String entry ->
			def jar = new File(entry)
			if (!jar.isFile() || !entry.contains(cacheRoot)) return   // Forbric's own jars are added above
			// <cache>/files-2.1/<group>/<name>/<version>/<sha>/<file>.jar
			def rest = entry.substring(entry.indexOf(cacheRoot) + cacheRoot.length()).split('/')
			if (rest.length < 5) return
			add("${rest[0]}:${rest[1]}:${rest[2]}".toString(), jar)
		}
		new File(outDir, 'forbric-kernel-libraries.json').text =
				groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([version: project.version, libraries: entries]))
		println "bundleForbric → ${entries.size()} jar(s), ${entries.sum { it.size } / 1024 / 1024} MB"
	}
}

// The merge tools are staged, never listed in the libraries manifest: they are a build tool the installer
// runs as a subprocess, not something the installed profile puts on a classpath.
tasks.register('bundleTools') {
	description = "Copy the merge-tools jar into the installer's resources."
	dependsOn 'buildMergeTools', 'buildLoaderJars'
	// The loader dropped the -SNAPSHOT qualifier at 0.1.0, so this is the name :mergeToolsJar writes. Asking
	// for the old one still "worked" for as long as a jar built before that release sat in build/libs: the
	// bundled tools would have been whatever was last built under the old name, silently, forever.
	inputs.file(mergeToolsJar)
			.withPropertyName('mergeTools').withPathSensitivity(PathSensitivity.NONE)
	inputs.file(linkBaseline).withPropertyName('linkBaseline').withPathSensitivity(PathSensitivity.NONE)
	outputs.dir(genTools)
	doLast {
		def src = mergeToolsJar
		if (!src.isFile()) throw new GradleException("missing ${src} — build it first")
		// What the installer will judge every player's merge against has to be the reviewed file, byte for byte.
		// A stale jar reaching this point is refused here rather than shipped.
		def packed = new java.util.zip.ZipFile(src).withCloseable { zip ->
			def entry = zip.getEntry('net/forbric/tools/link-check-baseline.txt')
			entry == null ? null : zip.getInputStream(entry).bytes
		}
		if (packed == null || !Arrays.equals(packed, linkBaseline.bytes)) {
			throw new GradleException("${src} carries ${packed == null ? 'no' : 'a different'} link baseline than"
					+ " ${linkBaseline}; rebuild it (:forbric-loader:mergeToolsJar) before bundling")
		}
		def dest = new File(genTools.get().asFile, 'forbric/tools/forbric-merge-tools.jar')
		dest.parentFile.mkdirs()
		dest.bytes = src.bytes
		println "bundleTools → ${src.length() / 1024} KB"
	}
}

sourceSets.main.resources.srcDir genTools
processResources.dependsOn 'bundleTools'

// A slim installer carries no library payload and downloads it from the release at install time. The bundled
// build stays the default because it is the one that works with no network.
//   ./gradlew jar             bundled (self-contained)
//   ./gradlew jar -Pslim      slim (downloads Forbric's jars at install time)
def slim = project.hasProperty('slim')
if (!slim) {
	sourceSets.main.resources.srcDir genResources
	processResources.dependsOn 'bundleForbric'
}

// Bake the release coordinates into the jar. RemoteSource reads this at runtime; its manifestSha256 is the
// trust anchor that makes the manifest's per-jar digests mean something, because it is the one digest an
// attacker who controls the release cannot rewrite.
if (project.hasProperty('releasePin')) {
	def pin = file(project.property('releasePin'))
	if (!pin.isFile()) throw new GradleException("releasePin file not found: ${pin}")
	processResources {
		from(pin) { rename '.*', 'forbric-release.properties' }
		// `from` a file that has since vanished copies nothing and says nothing — that would produce an
		// installer that looks pinned, is not, and only says so as a warning on a user's machine. So check at
		// execution time too: `clean jar -PreleasePin=build/...` deletes the pin before this task runs.
		doLast {
			def landed = new File(destinationDir, 'forbric-release.properties')
			if (!landed.isFile()) {
				throw new GradleException("-PreleasePin was given but ${pin} did not reach the jar. If you ran"
						+ " `clean` in the same invocation it deleted the pin first: re-run :releaseAssets,"
						+ " then build without clean.")
			}
		}
	}
}

// ---- GitHub release assets: what gets uploaded, and the manifest a slim installer downloads ----
//
// Two-step on purpose, and the order cannot be collapsed: the pin is a digest of the manifest, so the manifest
// has to exist before the installer that pins it is built.
//
// What is published must be what was accepted. releaseAssets therefore takes the release acceptance's evidence
// manifests (evidence.py run --release, comma-separated) and refuses to write any asset unless
// `evidence.py release-check` finds them all passed, bound to one candidate, and the kernel and merge-tools jars
// about to ship byte-identical to the accepted ones. Forbric's loader jars are not acceptance roles and are not
// compared; the game artifacts are built on each player's machine and do not reproduce byte for byte (zip entry
// times), so for them the installer's link check against the packaged baseline is the gate.
//
//   ./gradlew releaseAssets -PreleaseTag=v0.1.0 -PreleaseEvidence=build/evidence/release.json
//   gh release create v0.1.0 build/release/assets/*
//   ./gradlew jar -Pslim -PreleasePin=build/release/forbric-release.properties     (NOT with `clean`)
//   gh release upload v0.1.0 build/libs/forbric-kernel-installer-*.jar
tasks.register('releaseAssets') {
	description = 'Write build/release/: the jars to attach to a GitHub release + the manifest the installer downloads.'
	dependsOn 'bundleForbric', 'buildMergeTools'
	def repo = project.findProperty('releaseRepo') ?: 'https://github.com/Ray-T-r/Minecraft-Forbric-mod-loader'
	def outRoot = layout.buildDirectory.dir('release')
	outputs.dir(outRoot)
	doLast {
		def tag = project.findProperty('releaseTag')
		if (!tag) throw new GradleException('releaseAssets needs -PreleaseTag=<tag>, e.g. -PreleaseTag=v0.1.0')
		def staged = new File(genResources.get().asFile, 'forbric-kernel-libraries.json')
		if (!staged.isFile()) throw new GradleException("missing ${staged} — run :bundleForbric first")
		def manifest = new groovy.json.JsonSlurper().parse(staged)

		def evidence = project.findProperty('releaseEvidence')
		if (!evidence) {
			throw new GradleException('releaseAssets needs -PreleaseEvidence=<manifest.json>[,...] from the release'
					+ ' acceptance (evidence.py run --release); an unaccepted build is not published')
		}
		def kernelLib = manifest.libraries.find { (it.coordinate as String).startsWith('net.forbric:forbric-kernel:') }
		if (kernelLib == null) throw new GradleException("${staged} lists no forbric-kernel jar")
		def check = ['python3', new File(kernelDir, 'run/compat/evidence.py').path, 'release-check']
		(evidence as String).split(',').each { check += ['--manifest', file(it.trim()).path] }
		check += ['--publish', "kernel=${new File(genResources.get().asFile, (kernelLib.resource as String).substring(1))}",
				  '--publish', "merge-tools=${mergeToolsJar}"]
